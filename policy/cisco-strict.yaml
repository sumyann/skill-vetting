# Skill Scanner – Scan Policy
# Customise this file to match your organisation's security bar.
# Only include sections you want to override; omitted sections
# will use the built-in defaults.

policy_name: strict
policy_version: '1.0'
preset_base: strict
hidden_files:
  benign_dotfiles:
  - .dockerignore
  - .editorconfig
  - .gitattributes
  - .gitignore
  - .gitkeep
  - .gitmodules
  benign_dotdirs:
  - .circleci
  - .github
  - .gitlab
pipeline:
  known_installer_domains: []
  benign_pipe_targets:
  - ps\s.*\|\s*grep
  - grep\s.*\|\s*grep\s+-v
  doc_path_indicators:
  - docs
  - references
  demote_in_docs: false
  demote_instructional: false
  check_known_installers: false
  dedupe_equivalent_pipelines: false
  compound_fetch_require_download_intent: false
  compound_fetch_filter_api_requests: false
  compound_fetch_filter_shell_wrapped_fetch: false
  compound_fetch_exec_prefixes:
  - sudo
  - env
  - command
  - time
  - nohup
  - nice
  compound_fetch_exec_commands:
  - bash
  - sh
  - zsh
  - powershell
  - pwsh
  - source
  - python
  - python3
  - perl
  - ruby
  - node
  - .
  exfil_hints:
  - send
  - upload
  - transmit
  - webhook
  - slack
  - exfil
  - forward
  api_doc_tokens:
  - '@app.'
  - app.
  - router.
  - route
  - endpoint
rule_scoping:
  skillmd_and_scripts_only: []
  skip_in_docs:
  - COMMAND_INJECTION_JS_CHILD_PROCESS
  - COMMAND_INJECTION_JS_FUNCTION_CONSTRUCTOR
  - DATA_EXFIL_ENV_DUMP
  - DATA_EXFIL_JS_FS_ACCESS
  - DATA_EXFIL_JS_NETWORK
  - code_execution_generic
  - script_injection_generic
  - system_manipulation_generic
  code_only:
  - sql_injection_generic
  doc_path_indicators:
  - docs
  - references
  doc_filename_patterns:
  - tutorial|guide|howto
  dedupe_reference_aliases: false
  dedupe_duplicate_findings: false
  asset_prompt_injection_skip_in_docs: false
credentials:
  known_test_values: []
  placeholder_markers: []
system_cleanup:
  safe_rm_targets:
  - build
  - dist
  - temp
  - tmp
file_classification:
  inert_extensions:
  - .bmp
  - .db
  - .eot
  - .gif
  - .ico
  - .jpeg
  - .jpg
  - .otf
  - .png
  - .pyc
  - .pyo
  - .sqlite
  - .sqlite3
  - .tiff
  - .ttf
  - .webp
  - .woff
  - .woff2
  structured_extensions:
  - .pdf
  - .svg
  archive_extensions:
  - .7z
  - .apk
  - .bz2
  - .docm
  - .docx
  - .gz
  - .jar
  - .odp
  - .ods
  - .odt
  - .pptm
  - .pptx
  - .rar
  - .tar
  - .tar.gz
  - .tgz
  - .war
  - .xlsm
  - .xlsx
  - .xz
  - .zip
  code_extensions:
  - .bash
  - .js
  - .php
  - .pl
  - .py
  - .rb
  - .sh
  - .ts
  skip_inert_extensions: false
  allow_script_shebang_text_extensions: false
  script_shebang_extensions:
  - .bash
  - .js
  - .php
  - .pl
  - .py
  - .rb
  - .sh
  - .ts
file_limits:
  max_file_count: 50
  max_file_size_bytes: 2097152
  max_reference_depth: 3
  max_name_length: 48
  max_description_length: 512
  min_description_length: 30
  max_yara_scan_file_size_bytes: 20971520
  max_loader_file_size_bytes: 5242880
analysis_thresholds:
  zerowidth_threshold_with_decode: 20
  zerowidth_threshold_alone: 100
  analyzability_low_risk: 95
  analyzability_medium_risk: 80
  min_dangerous_lines: 3
  min_confidence_pct: 60
  exception_handler_context_lines: 30
  short_match_max_chars: 2
  cyrillic_cjk_min_chars: 5
  homoglyph_filter_math_context: false
  homoglyph_math_aliases:
  - COMMON
  - GREEK
  max_regex_pattern_length: 500
sensitive_files:
  patterns:
  - /etc/(?:passwd|shadow|hosts|sudoers)
  - ~?/\.(?:ssh|aws|gnupg|config|env|kube)
  - \.(?:env|pem|key|crt|p12|pfx|jks|keystore)
  - (?:credentials|secrets?|tokens?|password|private)
  - \$(?:HOME|USER|SSH_AUTH_SOCK|AWS_|KUBECONFIG)
command_safety:
  safe_commands:
  - ack
  - ag
  - b2sum
  - basename
  - cal
  - cat
  - cksum
  - column
  - comm
  - cut
  - date
  - diff
  - dir
  - dirname
  - echo
  - env
  - expand
  - 'false'
  - fd
  - file
  - fmt
  - fold
  - grep
  - groups
  - head
  - hostname
  - id
  - join
  - locate
  - ls
  - md5sum
  - nl
  - node
  - paste
  - printenv
  - printf
  - pwd
  - python
  - python3
  - readlink
  - realpath
  - rg
  - ruby
  - sha256sum
  - sha512sum
  - shasum
  - sort
  - stat
  - tail
  - tr
  - tree
  - 'true'
  - type
  - uname
  - unexpand
  - uniq
  - wc
  - where
  - whereis
  - which
  - whoami
  caution_commands:
  - apk
  - apt
  - apt-get
  - awk
  - brew
  - cargo
  - chgrp
  - chmod
  - chown
  - cmake
  - cp
  - dnf
  - dotnet
  - find
  - gawk
  - git
  - go
  - gradle
  - java
  - javac
  - less
  - ln
  - make
  - mkdir
  - more
  - mv
  - mvn
  - npm
  - pacman
  - perl
  - pip
  - pip3
  - rmdir
  - rustc
  - sed
  - touch
  - uv
  - yum
  risky_commands:
  - at
  - crontab
  - dd
  - fdisk
  - iptables
  - launchctl
  - mkfs
  - mount
  - nc
  - ncat
  - netcat
  - nft
  - nmap
  - rm
  - service
  - socat
  - systemctl
  - telnet
  - ufw
  - umount
  dangerous_commands:
  - base64
  - bash
  - csh
  - curl
  - dash
  - doas
  - docker
  - eval
  - exec
  - fish
  - gpg
  - ksh
  - kubectl
  - openssl
  - podman
  - rsync
  - scp
  - sftp
  - sh
  - source
  - ssh
  - su
  - sudo
  - tcsh
  - wget
  - zsh
  dangerous_arg_patterns:
  - \bpython[23]?\s+.*-c\s
  - \bnode\s+.*(?:-e|--eval)\s
  - \bruby\s+.*-e\s
  - \benv\s+.*(?:/bin/(?:ba)?sh|/bin/(?:z|da|fi)sh)
  - \bfind\s+.*-exec(?:dir)?\s
  - \b(?:less|more|man)\s+.*!\s*/bin/
  - \bpip[3]?\s+install\s+(?:--index-url|--extra-index-url|-i)\s
  - \bgit\s+(?:clone|remote\s+add)\s+.*[;&|]
  - \bpip[3]?\s+install\s+https?://
  - \bnpm\s+(?:run|exec)\s
  - \bnpx\s+
analyzers:
  static: true
  bytecode: true
  pipeline: true
  correlation: true
cel:
  mode: shadow
adjudicator:
  enabled: false
  min_fp_confidence: 3
llm_analysis:
  max_instruction_body_chars: 20000
  max_code_file_chars: 15000
  max_referenced_file_chars: 10000
  max_total_prompt_chars: 100000
  max_output_tokens: 8192
  meta_budget_multiplier: 3.0
  trusted_reference_domains: []
  contextual_risk_max_severity: ''
  low_confidence_max_severity: ''
finding_output:
  dedupe_exact_findings: true
  dedupe_same_issue_per_location: true
  same_issue_preferred_analyzers:
  - meta_analyzer
  - llm_analyzer
  - meta
  - llm
  - behavioral
  - pipeline
  - static
  - yara
  - analyzability
  same_issue_collapse_within_analyzer: true
  annotate_same_path_rule_cooccurrence: true
  attach_policy_fingerprint: true
severity_overrides:
- rule_id: BINARY_FILE_DETECTED
  severity: MEDIUM
  reason: Strict mode treats unknown binaries as medium risk
- rule_id: HIDDEN_DATA_FILE
  severity: MEDIUM
  reason: Strict mode flags all unknown hidden files at medium
- rule_id: PYCACHE_FILES_DETECTED
  severity: MEDIUM
  reason: Strict mode flags bytecode distribution at medium
disabled_rules: []
suppressions: []
